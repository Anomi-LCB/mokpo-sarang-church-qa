name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 (예: 2.4.1)'
        required: true
        type: string
      notes:
        description: '업데이트 내용 (한국어 변경 내역)'
        required: false
        default: '기능 개선 및 안정성 업데이트가 반영되었습니다.'
        type: string

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine version & release notes
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ inputs.version }}".TrimStart('v', 'V')
            $tag = "v$ver"
            $notes = @"
          ${{ inputs.notes }}
          "@
          } else {
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart('v', 'V')
            if (Test-Path "RELEASE_NOTES.md") {
              $notes = Get-Content -Raw -Encoding UTF8 "RELEASE_NOTES.md"
            } else {
              $notes = "### 목포사랑의교회 행정Q&A $tag`n- 최신 기능 개선 및 안정성 업데이트"
            }
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $notes | Out-File -FilePath "build_release_notes.md" -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          Push-Location frontend
          npm ci
          Pop-Location

      - name: Sync version & run safety tests
        shell: pwsh
        run: |
          python -X utf8 -c "from scripts.publish_release import sync_version_files; sync_version_files('${{ steps.meta.outputs.version }}')"
          python -X utf8 -m pytest -q tests/test_standardization_workspace.py tests/test_ai_and_updater.py

      - name: Build Frontend & Windows EXE Patch Package
        shell: pwsh
        run: |
          Push-Location frontend
          npm run build
          Pop-Location
          python -X utf8 packaging/windows/build_exe.py
          python -X utf8 scripts/publish_release.py --version "${{ steps.meta.outputs.version }}" --repo "${{ github.repository }}" --notes-file "build_release_notes.md" --skip-build --local-only

      - name: Publish GitHub Release (visible to all installed PCs)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: 목포사랑의교회 행정Q&A ${{ steps.meta.outputs.tag }}
          body_path: build_release_notes.md
          files: |
            dist/releases/mokpo-sarang-qa-win64-update-v${{ steps.meta.outputs.version }}.zip
            dist/releases/update-manifest.json
